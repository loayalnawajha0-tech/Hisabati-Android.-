
name: Build Bastati Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Bastati Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. استخراج مشروع Flutter
      - name: Extract Flutter project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 \
            -name "Bastati-Flutter-Project.zip" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            PUBSPEC=$(find extracted \
              -name pubspec.yaml -print -quit)

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC")
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

      # 3. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. إنشاء ملفات Android عند الحاجة
      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.loay.bastati .
          fi

      # 6. إصلاح إصدار intl
      - name: Fix intl dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          content = path.read_text(encoding="utf-8")

          pattern = r'^(\s*intl:\s*)[^\s#]+'
          updated, count = re.subn(
              pattern,
              r'\1^0.20.3',
              content,
              count=1,
              flags=re.MULTILINE
          )

          if count == 0:
              print("intl dependency not found; adding it.")
              content += "\ndependencies:\n  intl: ^0.20.3\n"
          else:
              content = updated

          path.write_text(content, encoding="utf-8")
          print("Updated intl dependency:")
          for line in content.splitlines():
              if re.match(r'^\s*intl:', line):
                  print(line)
          PY

      # 7. تثبيت المكتبات
      - name: Install dependencies
        run: flutter pub get

      # 8. فحص الكود
      - name: Analyze Flutter project
        run: flutter analyze

      # 9. تشغيل الاختبارات
      - name: Run tests
        run: flutter test

      # 10. بناء APK
      - name: Build Release APK
        run: flutter build apk --release

      # 11. رفع التطبيق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastati-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
