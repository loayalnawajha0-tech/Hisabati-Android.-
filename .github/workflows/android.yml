
name: Build Hisabati Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Hisabati APK
        run: |
          if [ -f settings.gradle.kts ]; then
            gradle assembleDebug
          elif [ -f HisabatiAndroid_Updated/settings.gradle.kts ]; then
            cd HisabatiAndroid_Updated
            gradle assembleDebug
          else
            echo "Android project folder not found!"
            find . -name settings.gradle.kts
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisabati-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
