
name: Build Bastati Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Bastati Android
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. استخراج مشروع Flutter إذا كان مضغوطاً
      - name: Extract Flutter project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 \
            -name "Bastati-Flutter-Project.zip" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            PUBSPEC=$(find extracted \
              -name pubspec.yaml -print -quit)

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC")
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

      # 3. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. إنشاء ملفات Android إذا لم تكن موجودة
      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.loay.bastati .
          fi

      # 6. إصلاح إصدار intl
      - name: Fix intl dependency
        run: flutter pub add intl:^0.20.3

      # 7. تثبيت المكتبات
      - name: Install dependencies
        run: flutter pub get

      # 8. فحص المشروع
      - name: Analyze Flutter project
        run: flutter analyze

      # 9. تشغيل الاختبارات
      - name: Run tests
        run: flutter test

      # 10. بناء APK
      - name: Build Release APK
        run: flutter build apk --release

      # 11. رفع التطبيق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastati-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
