
name: Build Hisabati Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          find . -name gradlew -type f
          find . -name settings.gradle.kts -o -name settings.gradle

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f app/gradlew ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle Wrapper not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisabati-APK
          path: '**/build/outputs/apk/debug/*.apk'
