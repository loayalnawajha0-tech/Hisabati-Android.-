


name: Build Bastati Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Flutter project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -name "Bastati-Flutter-Project.zip" -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found project: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml not found in ZIP"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC")
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter pubspec.yaml not found"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.loay.bastati .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastati-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
